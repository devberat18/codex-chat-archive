[package]
name = "codex-session-viewer"
version = "0.1.0"
description = "Readable local Codex session history viewer"
authors = ["Codex Session Viewer"]
edition = "2021"

[lib]
name = "codex_session_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "1"
